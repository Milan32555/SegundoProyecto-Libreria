name: cliente_movil_libreria
description: Cliente móvil (Flutter) del sistema de gestión de Librería - Segundo Proyecto Diseño de Soluciones
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Lora (serif) para los títulos — SIL Open Font License, ver assets/fuentes/OFL-Lora.txt
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fuentes/Lora-600.ttf
          weight: 600
        - asset: assets/fuentes/Lora-700.ttf
          weight: 700
