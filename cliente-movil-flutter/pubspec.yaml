name: cliente_movil_libreria
description: Cliente móvil (Flutter) del sistema de gestión de Librería - Segundo Proyecto Diseño de Soluciones
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Fuentes incluidas en la app (no dependen de internet) — SIL Open Font License,
  # ver assets/fuentes/OFL-*.txt. Playfair Display para títulos, Plus Jakarta Sans para el resto.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fuentes/PlayfairDisplay-600.ttf
          weight: 600
        - asset: assets/fuentes/PlayfairDisplay-700.ttf
          weight: 700
        - asset: assets/fuentes/PlayfairDisplay-800.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fuentes/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fuentes/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fuentes/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fuentes/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fuentes/PlusJakartaSans-800.ttf
          weight: 800
